<!DOCTYPE html>
<html>

<head>

    <title>Create Task</title>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f9;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin: 50px auto;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 15px;
            font-weight: bold;
        }

        input,
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin-top: 7px;
            border: 1px solid #ccc;
            border-radius: 7px;
        }

        textarea {
            height: 100px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            background: #007bff;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container">

    <div class="card">

        <h1>➕ Create New Task</h1>

        <form method="POST">

            {% csrf_token %}

            <label>Task Title</label>

            <input
                type="text"
                name="title"
                placeholder="Enter task title"
                required
            >


            <label>Description</label>

            <textarea
                name="description"
                placeholder="Enter task description"
                required
            ></textarea>


            <label>Status</label>

            <select name="status">

                <option value="Pending">
                    Pending
                </option>

                <option value="In Progress">
                    In Progress
                </option>

                <option value="Completed">
                    Completed
                </option>

            </select>


            <label>Priority</label>

            <select name="priority">

                <option value="Low">
                    Low
                </option>

                <option value="Medium" selected>
                    Medium
                </option>

                <option value="High">
                    High
                </option>

            </select>


            <label>Due Date</label>

            <input
                type="date"
                name="due_date"
                required
            >


            <button type="submit">
                Create Task
            </button>

        </form>


        <a href="{% url 'task_list' %}" class="back">
            ← Back to Tasks
        </a>

    </div>

</div>

</body>

</html>
